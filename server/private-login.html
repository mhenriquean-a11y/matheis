<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Entrar · Tropa do Raio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f3;color:#203b30;font:16px system-ui;display:grid;min-height:100vh;place-items:center;padding:24px}main{width:min(100%,440px);background:white;border:1px solid #dbe5dd;border-radius:18px;padding:32px}h1{font-size:28px;margin:8px 0}p{line-height:1.5;color:#52675c}label{display:block;margin:16px 0 0}input{display:block;width:100%;font:inherit;padding:12px;border:1px solid #b6c8bb;border-radius:6px;margin-top:6px}button{font:inherit;cursor:pointer;padding:12px;border-radius:6px;border:1px solid #246f51;background:#246f51;color:white;width:100%;margin-top:20px}button.secondary{color:#246f51;background:white;margin-top:10px}button:disabled{opacity:.6}#message{color:#9b3826;min-height:24px}[hidden]{display:none!important}small{display:block;line-height:1.5;margin-top:16px}
</style></head><body><main><small>TROPA DO RAIO · GRUPO PRIVADO</small><h1 id="title">Entre para estudar</h1><p>As atividades são reservadas aos integrantes do grupo. Cada pessoa tem seu próprio progresso.</p><form id="form"><label id="name-label" hidden>Seu nome<input id="name" maxlength="60" autocomplete="name"></label><label>Nome de usuário<input id="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label>Senha<input id="password" required type="password" minlength="8" maxlength="128" autocomplete="current-password"></label><label id="confirm-label" hidden>Confirme a senha<input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password"></label><label id="invite-label" hidden>Seu convite<input id="invite" autocomplete="off" maxlength="128" spellcheck="false"></label><p id="message" role="status" aria-live="polite"></p><button id="submit">Entrar</button></form><button type="button" id="toggle" class="secondary">Tenho convite · criar conta</button><small>O convite é usado uma única vez. Depois, entre com seu usuário e sua senha. Guarde a senha: não há recuperação automática por e-mail.</small></main><script>
const $=id=>document.getElementById(id);let register=false;
$('toggle').onclick=()=>{register=!register;for(const id of ['name','confirm','invite']){$(id+'-label').hidden=!register;$(id).required=register;} $('password').autocomplete=register?'new-password':'current-password';$('password').value='';$('confirm').value='';$('title').textContent=register?'Crie sua conta com convite':'Entre para estudar';$('submit').textContent=register?'Criar conta':'Entrar';$('toggle').textContent=register?'Já tenho conta · entrar':'Tenho convite · criar conta';$('message').textContent='';};
$('form').onsubmit=async event=>{event.preventDefault();if(register&&$('password').value!==$('confirm').value){$('message').textContent='As senhas não são iguais.';return;} $('submit').disabled=true;$('toggle').disabled=true;$('message').textContent='Conectando…';try{const response=await fetch('/api/auth/'+(register?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value,displayName:$('name').value,invitationCode:$('invite').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Não foi possível entrar.');location.replace('/');}catch(error){$('message').textContent=error.message||'Não foi possível conectar. Tente novamente.';}finally{$('submit').disabled=false;$('toggle').disabled=false;}};
</script></body></html>
